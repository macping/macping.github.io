<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macping — Mobile Apps</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Microsoft YaHei", sans-serif;
    background: #071426; color: #EAF4FB; line-height: 1.7; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; }
  .mono { font-family: Consolas, "Courier New", monospace; letter-spacing: .14em;
    color: rgba(159,179,200,.65); font-size: 13px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 300; letter-spacing: .06em; margin: 10px 0 6px; }
  .sub { color: #9FB3C8; margin-bottom: 40px; }
  .app { display: flex; gap: 18px; align-items: center; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .app img { width: 64px; height: 64px; border-radius: 16px; flex: none; }
  .app h2 { font-size: 1.1rem; font-weight: 600; }
  .app p { color: #9FB3C8; font-size: .9rem; margin: 4px 0 8px; }
  .links a { color: #18C8E8; text-decoration: none; font-size: .9rem; margin-right: 16px; }
  .links a:hover { text-decoration: underline; }
  footer { margin-top: 48px; color: rgba(159,179,200,.55); font-size: .82rem; }
  footer a { color: rgba(24,200,232,.75); text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="mono">MACPING // MOBILE APPS</div>
  <h1>macping</h1>
  <p class="sub">Practical tools for logistics and field work. 物流・現場向けの実用ツール。</p>

  <div class="app">
    <img src="https://raw.githubusercontent.com/macping/containerplanner/main/assets/branding/app_icon_1024.png" alt="Smart Container Loading icon">
    <div>
      <h2>Smart Container Loading / 智能集装箱装载 / スマートコンテナ積載</h2>
      <p>Container loading plans with 3D preview — computed fully offline.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.macping.containerplanner">Google Play</a>
        <a href="https://sites.google.com/view/container-plannerprivacypolicy/%E3%83%9B%E3%83%BC%E3%83%A0">Privacy Policy</a>
        <a href="https://github.com/macping/containerplanner/issues">Support</a>
      </div>
    </div>
  </div>

  <footer>
    Contact: <a href="https://github.com/macping">github.com/macping</a> ·
    <a href="mailto:macping@gmail.com">macping@gmail.com</a>
  </footer>
</main>
</body>
</html>
